# Blenheim Palace -- clearing examples
#
# Produced by scripts/run_clearing.py and checked cell by cell with
# clearing.verify.propagate. Every step lists the vertices a robot
# stands on; a robot sees D(v) from there and the evader may be
# anywhere it is not seen.

scene: blenheim-palace
scenario_file: ../scenes/blenheim-palace.yaml

graph_clear_label:
  # Kolling & Carpin's tree recursion on a maximum spanning forest of
  # the guard graph, one robot per swept vertex and per blocked edge.
  # An upper bound in a model that charges every edge separately; the
  # schedules below cover the frontier with a set cover over vertices
  # instead, and need fewer.
  robots: 18
  root_vertex: 0
  tree_edges: 35
  non_tree_edges: 132
  forest_components: 1

tolerance:
  # Cells no vertex sees. Small connected fragments of it are taken
  # out of the evader space (see clearing.scene.Scene.excluded); the
  # rest stays in and shows up as residual.
  uncoverable_m2: 102.24
  excluded_as_specks_m2: 102.24
  speck_max_area_m2: 4

runs:
  - key: kolling
    name: kolling/kolling
    steps: 20
    team_peak: 8
    team_median: 5
    cleared: True
    cleared_except_uncoverable: True
    residual_cells: 0
    residual_m2: 0.0
    recontamination_events: 0
    recontaminated_cells: 0
    makespan_s: 1022.7
    fleet: 8
    order: kolling
    steps_with_an_open_frontier: 0
    frontier_cells_left_open: 0
    steps_list:
      # one line per step: the vertices held
      - {t:   0, robots:   1, vertices: [0]}
      - {t:   1, robots:   2, vertices: [0, 8]}
      - {t:   2, robots:   3, vertices: [0, 2, 8]}
      - {t:   3, robots:   4, vertices: [0, 2, 8, 32]}
      - {t:   4, robots:   5, vertices: [0, 2, 8, 10, 32]}
      - {t:   5, robots:   5, vertices: [0, 2, 5, 10, 32]}
      - {t:   6, robots:   4, vertices: [0, 2, 10, 24]}
      - {t:   7, robots:   5, vertices: [0, 1, 4, 24, 29]}
      - {t:   8, robots:   5, vertices: [0, 1, 4, 24, 26]}
      - {t:   9, robots:   7, vertices: [0, 1, 3, 4, 24, 26, 34]}
      - {t:  10, robots:   8, vertices: [0, 1, 3, 4, 9, 22, 24, 26]}
      - {t:  11, robots:   7, vertices: [1, 4, 7, 9, 17, 21, 24]}
      - {t:  12, robots:   7, vertices: [1, 4, 7, 12, 16, 24, 30]}
      - {t:  13, robots:   6, vertices: [1, 4, 24, 28, 30, 33]}
      - {t:  14, robots:   7, vertices: [4, 6, 11, 14, 18, 24, 33]}
      - {t:  15, robots:   6, vertices: [4, 11, 18, 20, 25, 33]}
      - {t:  16, robots:   3, vertices: [11, 18, 31]}
      - {t:  17, robots:   4, vertices: [11, 18, 23, 31]}
      - {t:  18, robots:   5, vertices: [11, 15, 23, 31, 35]}
      - {t:  19, robots:   3, vertices: [13, 19, 27]}

  - key: sweep
    name: kolling/sweep
    steps: 16
    team_peak: 9
    team_median: 5
    cleared: True
    cleared_except_uncoverable: True
    residual_cells: 0
    residual_m2: 0.0
    recontamination_events: 0
    recontaminated_cells: 0
    makespan_s: 710.7
    fleet: 9
    order: sweep
    steps_with_an_open_frontier: 0
    frontier_cells_left_open: 0
    steps_list:
      # one line per step: the vertices held
      - {t:   0, robots:   1, vertices: [19]}
      - {t:   1, robots:   2, vertices: [19, 27]}
      - {t:   2, robots:   3, vertices: [13, 19, 35]}
      - {t:   3, robots:   3, vertices: [15, 23, 35]}
