# Keble College -- clearing examples
#
# Produced by scripts/run_clearing.py and checked cell by cell with
# clearing.verify.propagate. Every step lists the vertices a robot
# stands on; a robot sees D(v) from there and the evader may be
# anywhere it is not seen.

scene: keble-college
scenario_file: ../scenes/keble-college.yaml

graph_clear_label:
  # Kolling & Carpin's tree recursion on a maximum spanning forest of
  # the guard graph, one robot per swept vertex and per blocked edge.
  # An upper bound in a model that charges every edge separately; the
  # schedules below cover the frontier with a set cover over vertices
  # instead, and need fewer.
  robots: 12
  root_vertex: 1
  tree_edges: 23
  non_tree_edges: 61
  forest_components: 1

tolerance:
  # Cells no vertex sees. Small connected fragments of it are taken
  # out of the evader space (see clearing.scene.Scene.excluded); the
  # rest stays in and shows up as residual.
  uncoverable_m2: 56.6
  excluded_as_specks_m2: 56.6
  speck_max_area_m2: 4

runs:
  - key: kolling
    name: kolling/kolling
    steps: 20
    team_peak: 5
    team_median: 3
    cleared: True
    cleared_except_uncoverable: True
    residual_cells: 0
    residual_m2: 0.0
    recontamination_events: 0
    recontaminated_cells: 0
    makespan_s: 807.5
    fleet: 5
    order: kolling
    steps_with_an_open_frontier: 0
    frontier_cells_left_open: 0
    steps_list:
      # one line per step: the vertices held
      - {t:   0, robots:   1, vertices: [1]}
      - {t:   1, robots:   2, vertices: [1, 23]}
      - {t:   2, robots:   3, vertices: [1, 5, 23]}
      - {t:   3, robots:   3, vertices: [1, 22, 23]}
      - {t:   4, robots:   3, vertices: [1, 6, 23]}
      - {t:   5, robots:   4, vertices: [1, 6, 8, 18]}
      - {t:   6, robots:   5, vertices: [1, 8, 12, 18, 21]}
      - {t:   7, robots:   2, vertices: [3, 8]}
      - {t:   8, robots:   2, vertices: [3, 13]}
      - {t:   9, robots:   2, vertices: [3, 14]}
      - {t:  10, robots:   3, vertices: [3, 14, 15]}
      - {t:  11, robots:   4, vertices: [3, 9, 14, 15]}
      - {t:  12, robots:   5, vertices: [3, 7, 9, 14, 15]}
      - {t:  13, robots:   5, vertices: [3, 9, 14, 15, 20]}
      - {t:  14, robots:   5, vertices: [2, 3, 4, 14, 15]}
      - {t:  15, robots:   4, vertices: [0, 3, 4, 19]}
      - {t:  16, robots:   4, vertices: [0, 3, 4, 16]}
      - {t:  17, robots:   3, vertices: [0, 3, 10]}
      - {t:  18, robots:   3, vertices: [0, 3, 11]}
      - {t:  19, robots:   1, vertices: [17]}

  - key: sweep
    name: kolling/sweep
    steps: 19
    team_peak: 5
    team_median: 3
    cleared: True
    cleared_except_uncoverable: True
    residual_cells: 0
    residual_m2: 0.0
    recontamination_events: 0
    recontaminated_cells: 0
    makespan_s: 827.8
    fleet: 5
    order: sweep
    steps_with_an_open_frontier: 0
    frontier_cells_left_open: 0
    steps_list:
      # one line per step: the vertices held
      - {t:   0, robots:   1, vertices: [5]}
      - {t:   1, robots:   2, vertices: [5, 22]}
      - {t:   2, robots:   1, vertices: [1]}
      - {t:   3, robots:   2, vertices: [1, 23]}
      - {t:   4, robots:   3, vertices: [1, 6, 23]}
      - {t:   5, robots:   4, vertices: [1, 6, 21, 23]}
      - {t:   6, robots:   4, vertices: [1, 8, 12, 18]}
      - {t:   7, robots:   2, vertices: [8, 9]}
      - {t:   8, robots:   4, vertices: [3, 7, 8, 9]}
      - {t:   9, robots:   3, vertices: [3, 9, 13]}
      - {t:  10, robots:   3, vertices: [3, 9, 20]}
      - {t:  11, robots:   4, vertices: [3, 9, 14, 20]}
      - {t:  12, robots:   5, vertices: [3, 9, 14, 17, 20]}
      - {t:  13, robots:   4, vertices: [0, 2, 14, 17]}
      - {t:  14, robots:   5, vertices: [0, 2, 4, 14, 15]}
      - {t:  15, robots:   3, vertices: [0, 4, 11]}
