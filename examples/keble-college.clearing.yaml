  - key: all
    name: all vertices at once
    steps: 1
    team_peak: 24
    team_median: 24
    cleared: True
    cleared_except_uncoverable: True
    residual_cells: 0
    residual_m2: 0.0
    recontamination_events: 0
    recontaminated_cells: 0
    makespan_s: 121.9
    fleet: 24
    steps_list:
      # one line per step: the vertices held
