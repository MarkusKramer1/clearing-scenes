# Keble College -- clearing examples
#
# Produced by scripts/run_clearing.py and checked cell by cell with
# clearing.verify.propagate. Every step lists the vertices a robot
# stands on; a robot sees D(v) from there and the evader may be
# anywhere it is not seen.

scene: keble-college
scenario_file: ../scenes/keble-college.yaml

graph_clear_label:
  # Kolling & Carpin's tree recursion on a maximum spanning forest of
  # the guard graph, one robot per swept vertex and per blocked edge.
  # An upper bound in a model that charges every edge separately; the
  # schedules below cover the frontier with a set cover over vertices
  # instead, and need fewer.
  robots: 14
  root_vertex: 1
  tree_edges: 24
  non_tree_edges: 72
  forest_components: 1

tolerance:
  # Cells no vertex sees. Small connected fragments of it are taken
  # out of the evader space (see clearing.scene.Scene.excluded); the
  # rest stays in and shows up as residual.
  uncoverable_m2: 80.04
  excluded_as_specks_m2: 74.64
  speck_max_area_m2: 4

runs:
  - key: kolling
    name: kolling/kolling
    steps: 18
    team_peak: 9
    team_median: 4
    cleared: False
    cleared_except_uncoverable: True
    residual_cells: 135
    residual_m2: 5.4
    recontamination_events: 0
    recontaminated_cells: 0
    makespan_s: 878.8
    order: kolling
    steps_with_an_open_frontier: 0
    frontier_cells_left_open: 0
    steps_list:
      # one line per step: the vertices held
      - {t:   0, robots:   1, vertices: [1]}
      - {t:   1, robots:   2, vertices: [1, 11]}
      - {t:   2, robots:   2, vertices: [1, 22]}
      - {t:   3, robots:   2, vertices: [4, 22]}
      - {t:   4, robots:   3, vertices: [4, 14, 22]}
      - {t:   5, robots:   4, vertices: [4, 14, 20, 22]}
      - {t:   6, robots:   5, vertices: [4, 6, 14, 15, 22]}
      - {t:   7, robots:   3, vertices: [4, 7, 14]}
      - {t:   8, robots:   4, vertices: [4, 7, 13, 14]}
      - {t:   9, robots:   5, vertices: [4, 7, 13, 14, 24]}
      - {t:  10, robots:   7, vertices: [0, 3, 4, 7, 14, 21, 24]}
      - {t:  11, robots:   6, vertices: [0, 3, 4, 5, 10, 14]}
      - {t:  12, robots:   7, vertices: [2, 3, 4, 5, 10, 12, 14]}
      - {t:  13, robots:   9, vertices: [2, 3, 4, 5, 8, 10, 12, 14, 19]}
      - {t:  14, robots:   5, vertices: [2, 4, 10, 14, 18]}
      - {t:  15, robots:   5, vertices: [2, 4, 9, 14, 16]}
      - {t:  16, robots:   4, vertices: [2, 4, 14, 23]}
      - {t:  17, robots:   3, vertices: [4, 14, 17]}

  - key: sweep
    name: kolling/sweep
    steps: 17
    team_peak: 9
    team_median: 4
    cleared: False
    cleared_except_uncoverable: True
    residual_cells: 135
    residual_m2: 5.4
    recontamination_events: 0
    recontaminated_cells: 0
    makespan_s: 1071.3
    order: sweep
    steps_with_an_open_frontier: 0
    frontier_cells_left_open: 0
    steps_list:
      # one line per step: the vertices held
      - {t:   0, robots:   1, vertices: [11]}
      - {t:   1, robots:   2, vertices: [1, 11]}
      - {t:   2, robots:   2, vertices: [1, 22]}
      - {t:   3, robots:   2, vertices: [4, 22]}
      - {t:   4, robots:   3, vertices: [4, 14, 22]}
      - {t:   5, robots:   4, vertices: [4, 14, 15, 22]}
      - {t:   6, robots:   5, vertices: [4, 6, 14, 20, 22]}
      - {t:   7, robots:   3, vertices: [4, 12, 14]}
      - {t:   8, robots:   4, vertices: [4, 12, 13, 14]}
      - {t:   9, robots:   6, vertices: [4, 7, 8, 12, 13, 14]}
      - {t:  10, robots:   6, vertices: [4, 7, 12, 13, 14, 19]}
      - {t:  11, robots:   9, vertices: [0, 3, 4, 7, 10, 12, 14, 19, 21]}
      - {t:  12, robots:   7, vertices: [0, 2, 3, 4, 10, 14, 24]}
