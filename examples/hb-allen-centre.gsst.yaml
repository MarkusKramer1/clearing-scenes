# HB Allen Centre -- Kolling et al. (2010) as published
#
# GSST over random depth-first spanning forests of the guard graph:
# the Barriere et al. label recursion with sliding forbidden, then the
# tree strategy converted back to a graph strategy by stationing a
# robot wherever a cycle edge leads into a contaminated vertex.
# Produced by scripts/run_gsst.py.

scene: hb-allen-centre
scenario_file: ../scenes/hb-allen-centre.yaml
trees_per_variant: 100
seed: 1

graph:
  vertices: 20
  edges: 84
  edges_regular: 58
  edges_shady: 26

variants:
  # team_* are the peak of the GRAPH strategy over the drawn forests.
  # The paper's own output; a claim about the guard graph under vertex
  # contamination, not about the surface.
  - variant: naive
    trees: 100
    team_min: 9
    team_mean: 11.55
    team_sd: 1.31
    team_max: 15
    tree_label_min: 2
    tree_label_at_best: 2
    steps: 20
    shady_in_best_tree: 5
    cycle_edges_in_best: 65
    graph_cleared: True
    verified_on_cells:
      # the same schedule, judged by clearing.verify, which is
      # told nothing about guard regions or shadiness
      steps: 20
      team_peak: 9
      team_median: 5
      cleared: False
      cleared_except_uncoverable: False
      residual_cells: 26946
      residual_m2: 1077.84
      recontamination_events: 6
      recontaminated_cells: 26840
      makespan_s: 566.5
      fleet: 9
    steps_list:
      # one line per step: the vertices held
      - {t:   0, robots:   1, vertices: [7]}
      - {t:   1, robots:   2, vertices: [7, 10]}
      - {t:   2, robots:   3, vertices: [0, 7, 10]}
