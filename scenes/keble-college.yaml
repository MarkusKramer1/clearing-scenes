# Keble College -- ground-robot clearing scenario
#
# Vertices are sampled sensor positions on the walkable surface. An edge
# (i, j) exists where a robot at j can watch part of the rim of what a
# robot at i sees -- the guard region of Kolling et al. 2010. `routes`
# gives the ground robot's travel time between every pair of vertices;
# the path it actually walks along each edge is in the npz beside it.
#
# Regenerate with scripts/export_from_e1.py; see docs/scene-format.md.

scene: keble-college
title: Keble College

source:
  dataset: Oxford Spires Dataset (Tao et al., IJRR 2025)
  survey: terrestrial laser scan, merged cloud + individual E57 setups
  pipeline: e1-clearing-graph, stages 2-6
  occupancy: O-carved (unobserved space blocks)
  graph_file: carved_huav20_R30_seed1
  note: the ground half of E1's two-platform graph; identical for every h_uav, which only selects the file

robot:
  kind: ground
  sensor_height_m: 1.0
  detection_range_m: 30.0
  speed_m_s: 1.0

target:
  height_m: 1.0
  radius_m: 0.25
  visibility: all 5 rays to the target cylinder must pass

boundary:
  # Where the scenario stops. Drawn by hand in e1-clearing-graph
  # (configs/site_boundary.yaml) and approved there; the surface,
  # the vertices, the guard regions and the routes below are all
  # what survives it. The evader cannot leave it and no robot has to
  # watch across it: the drawn lines are held, not open frontier.
  bounded: true
  stamp: 76b72f7f0b17            # hash of the drawn lines; matches E1's approval
  approved: 2026-08-22
  source: e1-clearing-graph configs/site_boundary.yaml, drawn by hand
  cuts: 4                  # hand-drawn lines across the openings
  held_line_m: 49.5          # how much of the perimeter those lines are
  cells_dropped: 4849       # walkable cells outside it, removed before anything was indexed
  walkable_dropped_m2: 194   # what that is in area: surveyed ground this scenario gives up
  excluded_m2: 236.2           # E1's own figure, measured on its 0.4 m boundary raster rather
                              # than on this 0.2 m walkable surface, so the two differ slightly
  rim_segments: 2434
  rim_length_m: 973.6       # the whole outline, in the npz as boundary_seg

surface:
  geometry_file: geometry/keble-college.npz
  cell_size_m: 0.2
  cells: 154283
  area_m2: 6171.32
  bbox_min: [-92.62, -80.93, -6.95]
  bbox_max: [45.38, 34.07, -0.52]
  max_step_m: 0.25          # height a neighbouring cell may differ by
  evader_edges: 606557       # 8-connected under that rule; recomputed, not stored
  uncoverable_cells: 1415   # seen by no vertex, at any team size
  uncoverable_area_m2: 56.6

